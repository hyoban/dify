name: Node Modules Inspector

on:
  push:
    branches: [analysis/node-modules-inspector]

permissions:
  contents: read

concurrency:
  group: node-modules-inspector-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hyoban/dify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      # Re-running this workflow refreshes the snapshot from upstream main.
      - name: Checkout latest upstream main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: langgenius/dify
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build static dependency report
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          export SOURCE_SHA
          cat > node-modules-inspector.config.mjs <<'CONFIG'
          export default {
            name: `Dify · upstream main · ${process.env.SOURCE_SHA.slice(0, 12)}`,
          }
          CONFIG
          pnpm dlx node-modules-inspector@2.7.0 build \
            --depth 100 \
            --base "${BASE_PATH}/" \
            --outDir "$RUNNER_TEMP/inspector"
          # GitHub Pages serves this SPA fallback for direct links to views.
          cp "$RUNNER_TEMP/inspector/index.html" "$RUNNER_TEMP/inspector/404.html"
          touch "$RUNNER_TEMP/inspector/.nojekyll"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          writeFileSync(`${process.env.RUNNER_TEMP}/inspector/source.json`, JSON.stringify({
            repository: 'langgenius/dify',
            ref: 'main',
            sha: process.env.SOURCE_SHA,
            inspector: '2.7.0',
            platform: process.platform,
            generatedAt: new Date().toISOString(),
          }, null, 2))
          JS
          echo "Analyzed [langgenius/dify@${SOURCE_SHA}](https://github.com/langgenius/dify/commit/${SOURCE_SHA}) with node-modules-inspector 2.7.0." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/inspector

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
